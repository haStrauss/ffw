name: Deploy to Server

on:
  push:
    branches: [ main ]

permissions:
  contents: read

# Zwei Pushes kurz hintereinander werden nacheinander deployt, nicht gleichzeitig.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Erst wenn alle Tests grün sind, kommt der Stand auf den Server.
  test:
    uses: ./.github/workflows/tests.yml
    # Reicht u. a. SIXLABORS_LICENSE_KEY an die Tests weiter (Secrets gehen sonst nicht an aufgerufene Workflows).
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Der Six-Labors-Lizenzschlüssel (ImageSharp) kommt aus dem GitHub-Secret und wird nur für diese Shell
          # gesetzt; docker compose reicht ihn als Build-Secret an den Image-Build weiter. Eine Zeile in der
          # .env auf dem Server ist dafür nicht nötig.
          script: |
            cd ~/FFW
            git pull origin main
            export SIXLABORS_LICENSE_KEY='${{ secrets.SIXLABORS_LICENSE_KEY }}'
            docker compose up -d --build

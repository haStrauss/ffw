name: Deploy to Server

on:
  push:
    branches: [ main ]

permissions:
  contents: read

# Zwei Pushes kurz hintereinander werden nacheinander deployt, nicht gleichzeitig.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Erst wenn alle Tests grün sind, kommt der Stand auf den Server.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/FFW
            git pull origin main
            docker compose up -d --build

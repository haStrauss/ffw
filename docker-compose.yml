services:
  web:
    build:
      context: .
      dockerfile: ffw/Dockerfile
      secrets:
        - sixlabors_license
    container_name: web-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=ffwdb;Username=ffwuser;Password=${POSTGRES_PASSWORD}
      - Fotos__Speicherpfad=/app/data/fotos
      - Dokumente__Speicherpfad=/app/data/dokumente
      - DataProtection__Pfad=/app/data/keys
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Admin__Email=${ADMIN_EMAIL:-}
      - Admin__Password=${ADMIN_PASSWORD:-}
    volumes:
      - fotos:/app/data/fotos
      - dokumente:/app/data/dokumente
      - keys:/app/data/keys
    depends_on:
      - db
    networks:
      - ffw-network

  db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ffwdb
      - POSTGRES_USER=ffwuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ffw-network

# Lizenzschlüssel für ImageSharp, nur zum Bauen des Images. Beim Deployment setzt ihn deploy.yml in der Shell;
# von Hand auf dem Server: export SIXLABORS_LICENSE_KEY='<ganze Lizenzzeile>' vor docker compose up --build.
secrets:
  sixlabors_license:
    environment: SIXLABORS_LICENSE_KEY

networks:
  ffw-network:
    driver: bridge

volumes:
  pgdata:
  fotos:
  dokumente:
  keys:

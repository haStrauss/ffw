services:
  web:
    build:
      context: .
      dockerfile: dockerFFW
    container_name: web-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=ffwdb;Username=ffwuser;Password=iIZ5Qbro0BVw6LtSWqgJ
    depends_on:
      - db
    networks:
      - ffw-network

  db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ffwdb
      - POSTGRES_USER=ffwuser
      - POSTGRES_PASSWORD=iIZ5Qbro0BVw6LtSWqgJ
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ffw-network

networks:
  ffw-network:
    driver: bridge

volumes:
  pgdata:
